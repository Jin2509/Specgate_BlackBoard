name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web_ui/**", "backend/**", "deploy/**", "compose.yaml"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Chạy deploy/update.sh trên VPS qua SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          APP_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" "cd '${APP_DIR:-/opt/specgate/spec_gate}' && ./deploy/update.sh"
