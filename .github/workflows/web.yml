name: web

on:
  push:
    branches: [main, dev]
    paths: ["web_ui/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web_ui/**", ".github/workflows/web.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web_ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web_ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Build Docker image
        working-directory: .
        run: docker build -t specgate-web web_ui
