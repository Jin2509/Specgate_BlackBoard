# Chạy cả hệ thống trên máy: docker compose up --build
#   web      http://localhost:3000
#   backend  http://localhost:8000/docs (chỉ mở trên máy này)
# Server công khai dùng thêm deploy/compose.prod.yaml (Caddy, HTTPS, đăng nhập), xem deploy/README.md.
name: specgate

services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/specgate.db
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${BACKEND_MEM:-1g}
    cpus: ${BACKEND_CPUS:-2}

  web:
    build:
      context: ./web_ui
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  backend-data:
